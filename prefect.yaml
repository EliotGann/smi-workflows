name: prefect-docker-pixi-tiled-smi
prefect-version: 3.6.10

build: null

push: null

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /repo
  - prefect.deployments.steps.git_clone:
      repository: https://github.com/nsls2/smi-workflows.git
      branch: main

deployments:
  - name: smi-end-of-run-workflow-docker
    version: 0.1.3
    tags:
      - smi
      - main
    description: Deploy the updated Docker image
    entrypoint: end_of_run_workflow.py:end_of_run_workflow
    parameters: {}
    schedule: {}
    work_pool:
      job_variables:
        image: ghcr.io/nsls2/smi-workflows:main
        image_pull_policy: Always
        network: slirp4netns
        volumes:
          - /nsls2/data/smi/proposals:/nsls2/data/smi/proposals
          - /nsls2/data/smi/shared/default_nb:/nsls2/data/smi/shared/default_nb
          - /srv/prefect3_docker_worker_smi/app:/srv
        container_create_kwargs:
          userns_mode: "keep-id:uid=402959,gid=402959"  # workflow-smi:workflow-smi
        auto_remove: true
      name: smi-work-pool-docker
